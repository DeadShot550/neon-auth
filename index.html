    /* =========================================================

    html, body {

    /* Atmospheric red orb — hardware accelerated, zero blur overhead */
    .crx-orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
      will-change: transform, opacity;
      transform: translateZ(0);

    .orb-crimson {

    }

    .orb-deep-red {
      background: radial-gradient(circle at 50% 50%, rgba(120, 15, 10, 0.16) 0%, rgba(80, 8, 5, 0.04) 50%, transparent 75%);
    }

    /* Scroll reveal — base states */
    .reveal-up {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal-up.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    .reveal-fade {
      opacity: 0;
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal-fade.revealed {
      opacity: 1;
    }

    .reveal-blur {
      opacity: 0;
      filter: blur(8px);
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), filter 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal-blur.revealed {
      opacity: 1;
      filter: blur(0);
    }

    .reveal-scale {
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal-scale.revealed {
      opacity: 1;
      transform: scale(1);
    }

    /* Stagger children */
    .stagger-children > * {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1), transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .stagger-children.revealed > *:nth-child(1) { opacity: 1; transform: none; transition-delay: 0ms; }
    .stagger-children.revealed > *:nth-child(2) { opacity: 1; transform: none; transition-delay: 80ms; }
    .stagger-children.revealed > *:nth-child(3) { opacity: 1; transform: none; transition-delay: 160ms; }
    .stagger-children.revealed > *:nth-child(4) { opacity: 1; transform: none; transition-delay: 240ms; }
    .stagger-children.revealed > *:nth-child(5) { opacity: 1; transform: none; transition-delay: 320ms; }
    .stagger-children.revealed > *:nth-child(6) { opacity: 1; transform: none; transition-delay: 400ms; }
    .stagger-children.revealed > *:nth-child(7) { opacity: 1; transform: none; transition-delay: 480ms; }

    /* Light sweep effect for cards */
    .light-sweep-target {
      position: relative;
      overflow: hidden;
    }
    .light-sweep-target::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 45%;
      height: 100%;
      background: linear-gradient(
        105deg,
        transparent 0%,
        rgba(255, 255, 255, 0.015) 40%,
        rgba(255, 255, 255, 0.04) 50%,
        rgba(255, 255, 255, 0.015) 60%,
        transparent 100%
      );
      transform: skewX(-15deg);
      transition: none;
      pointer-events: none;
    }
    .light-sweep-target:hover::after {
      animation: lightSweep 0.85s ease-in-out forwards;
    }

    /* Reduce motion accessibility */
    @media (prefers-reduced-motion: reduce) {
